<div id="freecell-live-preview" class="viz-dotted-background">
  <style>
    #freecell-live-preview{display:grid;place-items:center;padding:10px 0;font-family:Roboto,Arial,sans-serif}
    #freecell-live-preview .game-phone{--felt-a:#0b6430;--felt-b:#075b2c;position:relative;width:min(420px,100%);height:746px;overflow:hidden;border-radius:21px;background:radial-gradient(circle at 52% 34%,rgba(255,255,255,.045),transparent 38%),linear-gradient(150deg,var(--felt-a),var(--felt-b));box-shadow:0 20px 58px rgba(0,0,0,.28);color:#fdf2d8;user-select:none;touch-action:none}
    /* Faint texture over the table. Performance (owner report 2026-11-05, an old phone stuttering): it used
       mix-blend-mode:soft-light, so the whole screen was blended again on every frame of every card
       animation; now a plain layer, and none with reduced effects. */
    #freecell-live-preview .game-phone::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:repeating-linear-gradient(19deg,rgba(255,255,255,.08) 0 1px,transparent 1px 4px)}
    #freecell-live-preview .game-phone[data-effects="low"]::after{display:none}
    #freecell-live-preview .scorebar{position:relative;z-index:2;height:43px;display:grid;grid-template-columns:auto repeat(3,1fr);column-gap:8px;align-items:center;background:rgba(0,45,22,.76);font-size:18px;padding:0 8px;box-sizing:border-box;text-shadow:0 1px 2px rgba(0,0,0,.45)}
    #freecell-live-preview .scorebar div:nth-of-type(2){text-align:center}
    #freecell-live-preview .scorebar div:last-child{text-align:right}
    #freecell-live-preview .scorebar span{font-variant-numeric:tabular-nums}
    #freecell-live-preview .playfield{position:relative;z-index:1;padding:9px 4px 98px;box-sizing:border-box}
    #freecell-live-preview .top-row,#freecell-live-preview .columns{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
    #freecell-live-preview .top-row{height:69px}
    #freecell-live-preview .game-phone.freecell-right .top-row .cell-slot{order:2}
    #freecell-live-preview .game-phone.freecell-right .top-row .foundation-empty{order:1}
    #freecell-live-preview .game-phone.left-handed .toolbar{direction:rtl}
    #freecell-live-preview .game-phone.left-handed .tool{direction:ltr}
    #freecell-live-preview .slot{position:relative;display:block;min-width:0;height:67px;padding:0;border:1px solid rgba(255,255,255,.13);border-radius:4px;background:rgba(0,42,20,.18);color:rgba(253,242,216,.16);font:400 45px/67px Arial;text-align:center;box-sizing:border-box}
    #freecell-live-preview .slot.foundation-empty::before{content:"";position:absolute;width:min(47px,calc(100% - 2px));aspect-ratio:1;box-sizing:border-box;border:3px solid rgba(255,255,255,.12);border-radius:50%;left:50%;top:50%;translate:-50% -50%}
    #freecell-live-preview .columns{margin-top:13px;align-items:start}
    #freecell-live-preview .column{position:relative;min-width:0;height:478px;border-radius:4px}
    #freecell-live-preview .column:empty::before{content:"";display:block;height:73px;box-sizing:border-box;border:1px solid rgba(255,255,255,.08);border-radius:4px;background:rgba(0,42,20,.08)}
    #freecell-live-preview .playing-card{position:relative;display:block;width:100%;height:70px;box-sizing:border-box;padding:0;border:1px solid var(--card-edge,#bbb9b3);border-radius:var(--card-radius,4px);background:var(--card-face,linear-gradient(145deg,#f7f3e9 0%,#efe8d8 100%));color:#070909;box-shadow:0 2px 3px rgba(0,0,0,.34);font:500 21px/24px Arial;text-align:left;overflow:hidden;touch-action:none;transition:transform .14s ease,box-shadow .14s ease}
    #freecell-live-preview .game-phone[data-card-style="modern"]{--card-face:linear-gradient(160deg,#fff 0%,#edf3ef 100%);--card-edge:#9cb0a3;--card-radius:8px}
    #freecell-live-preview .game-phone[data-card-style="minimal"]{--card-face:#f4efe3;--card-edge:#d8d8d8;--card-radius:2px}
    #freecell-live-preview .game-phone[data-card-style="minimal"] .playing-card .pip{opacity:.78}
    #freecell-live-preview .column>.playing-card{position:absolute;left:0;top:var(--card-top,0px);z-index:var(--card-layer,1);margin:0}
    #freecell-live-preview .playing-card.red{color:#d52f1d}
    #freecell-live-preview .playing-card .corner{position:absolute;z-index:3;left:3px;right:2px;top:1px;display:flex;align-items:flex-start;justify-content:space-between;white-space:nowrap;font-family:'Roboto Condensed','sans-serif-condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:25px;font-size:min(25px,54cqw);line-height:25px;letter-spacing:-1px}
    #freecell-live-preview .playing-card.ten .corner>span:first-child{letter-spacing:-2px}
    #freecell-live-preview .playing-card.ten .mini-suit{font-size:16px;font-size:min(16px,35cqw)}
    /* Corner type follows the card width, so narrow phones keep a gap between rank and suit. */
    #freecell-live-preview .playing-card{container-type:inline-size}
    #freecell-live-preview .playing-card .mini-suit{margin-top:2px;font-size:19px;font-size:min(19px,41cqw);line-height:19px;letter-spacing:0}
    #freecell-live-preview .playing-card .pip{position:absolute;left:50%;top:63%;translate:-50% -50%;font-size:44px;line-height:1}
    #freecell-live-preview .playing-card.face .pip{display:none}
    #freecell-live-preview .playing-card .court{position:absolute;left:50%;top:28px;translate:-50% 0;width:30px;height:38px;display:block;overflow:hidden;border:1px solid currentColor;border-radius:2px;background:#fffdf4;font-style:normal;line-height:1;box-sizing:border-box}
    /* Court art is painted in its own layer: inline SVG figures otherwise make some Android
       WebViews skip or duplicate whole rows of screen tiles (blank bands, repeated blocks). */
    #freecell-live-preview .court-art{shape-rendering:geometricPrecision;contain:paint;will-change:transform}
    #freecell-live-preview .court-art .court-paper{fill:#fffdf4}
    #freecell-live-preview .court-art .court-ink{fill:#111;stroke:#111}
    #freecell-live-preview .court-art .court-red{fill:#e3222d;stroke:#111}
    #freecell-live-preview .court-art .court-blue{fill:#0877bd;stroke:#111}
    #freecell-live-preview .court-art .court-gold{fill:#f3d313;stroke:#111}
    #freecell-live-preview .court-art .court-green{fill:#59a52f;stroke:#111}
    #freecell-live-preview .court-art .court-skin{fill:#f6e8ca;stroke:#111}
    #freecell-live-preview .court-art .court-white{fill:#fff;stroke:#111}
    #freecell-live-preview .court-art .court-line{fill:none;stroke:#111;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
    #freecell-live-preview .court-art .court-fine{fill:none;stroke:#111;stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
    #freecell-live-preview .court-art .court-suit-ink{fill:currentColor;stroke:#111;stroke-width:.35}
    #freecell-live-preview .playing-card .court-crown{position:absolute;z-index:3;left:50%;top:0;translate:-50% 0;color:#7a5b00;font-size:13px;line-height:12px}
    #freecell-live-preview .playing-card .court-head{position:absolute;z-index:2;left:50%;top:11px;translate:-50% 0;width:12px;height:13px;border:1px solid #7a542e;border-radius:50%;background:#edbd86;box-sizing:border-box}
    #freecell-live-preview .playing-card .court-body{position:absolute;z-index:1;left:50%;top:23px;translate:-50% 0;width:27px;height:25px;border-radius:12px 12px 2px 2px;background:currentColor;opacity:.88}
    #freecell-live-preview .playing-card .court-suit{position:absolute;z-index:4;right:2px;bottom:1px;padding:1px;border-radius:50%;background:#f8f4e8;font-size:12px;line-height:12px}
    #freecell-live-preview .column>.playing-card:not(.last-card) .pip,#freecell-live-preview .column>.playing-card:not(.last-card) .court{display:none}
    #freecell-live-preview .playing-card.last-card:not(.face) .pip{display:block;opacity:1}
    #freecell-live-preview .playing-card.last-card.face .court{display:grid}
    #freecell-live-preview .column>.playing-card.reveal-under:not(.face) .pip{display:block;opacity:1}
    #freecell-live-preview .column>.playing-card.reveal-under.face .court{display:grid}
    #freecell-live-preview .playing-card.lifted{transform:translateY(-6px);box-shadow:0 0 0 3px #ffe06e,0 7px 10px rgba(0,0,0,.35);z-index:30}
    #freecell-live-preview .playing-card.hint{animation:hint-pulse .6s ease-in-out 2}
    #freecell-live-preview .playing-card.auto-source-card,#freecell-live-preview .playing-card.drag-source-hidden{opacity:0!important;box-shadow:none!important;pointer-events:none}
    #freecell-live-preview .playing-card.auto-flight-card{position:absolute;z-index:75;margin:0;pointer-events:none;will-change:transform;transition:none;box-shadow:0 7px 12px rgba(0,0,0,.3)}
    #freecell-live-preview .playing-card.invalid-shake{animation:invalid-shake .34s ease-in-out;box-shadow:0 2px 3px rgba(0,0,0,.34)}
    /* A press gives no feedback by itself: the card moves, or shakes when it cannot. */
    #freecell-live-preview .playing-card{-webkit-tap-highlight-color:transparent}
    #freecell-live-preview .slot>.playing-card{position:absolute;inset:0;height:100%;margin:0}
    #freecell-live-preview .drag-ghost{position:absolute;left:0;top:0;z-index:50;width:calc((100% - 31px)/8);pointer-events:none;will-change:transform}
    #freecell-live-preview .drag-ghost .playing-card{box-shadow:0 7px 12px rgba(0,0,0,.3)}
    #freecell-live-preview .drag-ghost .playing-card{height:70px}
    #freecell-live-preview .drag-ghost .playing-card+.playing-card{margin-top:-38px}
    @keyframes hint-pulse{50%{box-shadow:0 0 0 4px #ffe06e,0 5px 8px rgba(0,0,0,.35);transform:translateY(-5px)}}
    @keyframes invalid-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    #freecell-live-preview .winning{position:absolute;left:0;bottom:88px;z-index:3;min-width:108px;padding:8px 17px;background:rgba(0,50,25,.56);border-radius:0 7px 0 0;font-size:16px;text-align:center}
    #freecell-live-preview .praise{position:absolute;z-index:70;left:50%;top:40%;padding:8px 24px;border:2px solid rgba(241,198,109,.55);border-radius:26px;background:rgba(0,38,19,.78);color:#f6d27a;font:700 26px Roboto,Arial,sans-serif;letter-spacing:.03em;white-space:nowrap;text-shadow:0 2px 0 #3c2517;box-shadow:0 8px 18px rgba(0,0,0,.35);pointer-events:none;animation:praise-pop 1.5s ease-out forwards}
    @keyframes praise-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}24%{transform:translate(-50%,-50%) scale(1)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,calc(-50% - 18px)) scale(1)}}
    #freecell-live-preview .suit-burst{position:absolute;z-index:65;width:0;height:0;pointer-events:none;color:#15201a}
    #freecell-live-preview .suit-burst.red{color:#d0352a}
    #freecell-live-preview .suit-burst i{position:absolute;left:-.5em;top:-.5em;width:1em;height:1em;font-style:normal;line-height:1em;text-align:center}
    #freecell-live-preview .autocomplete-button{position:absolute;z-index:60;left:50%;bottom:134px;translate:-50% 0;min-height:40px;padding:0 24px;border:1px solid #7cc98c;border-radius:20px;background:#39a94d;color:#fdf2d8;font:600 15px Roboto,Arial,sans-serif;letter-spacing:.02em;box-shadow:0 3px 0 #185f2d,0 6px 12px rgba(0,0,0,.3);cursor:pointer}
    #freecell-live-preview .autocomplete-button[hidden]{display:none}
    #freecell-live-preview .autocomplete-button:active{translate:-50% 2px;box-shadow:0 1px 0 #185f2d,0 3px 8px rgba(0,0,0,.25)}
    #freecell-live-preview .toolbar{position:absolute;z-index:3;left:0;right:0;bottom:0;height:89px;display:grid;grid-template-columns:repeat(5,1fr);gap:1px;padding:4px 3px 2px;box-sizing:border-box;background:rgba(0,53,27,.55);touch-action:manipulation}
    #freecell-live-preview .tool{appearance:none;border:0;background:transparent;color:#fdf2d8;font:400 13px Roboto,Arial,sans-serif;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:auto;touch-action:manipulation}
    #freecell-live-preview .tool-icon{width:47px;height:47px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;box-sizing:border-box;font-size:27px;line-height:1;background:rgba(0,72,36,.18)}
    #freecell-live-preview .tool-icon svg{width:27px;height:27px;stroke-width:2.4}
    #freecell-live-preview .tool:active .tool-icon{background:rgba(255,255,255,.18);transform:scale(.96)}
    #freecell-live-preview .message{position:absolute;z-index:90;left:50%;bottom:103px;translate:-50% 6px;max-width:78%;padding:7px 12px;border-radius:16px;background:rgba(0,0,0,.82);font-size:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .16s,translate .16s}
    #freecell-live-preview .message.visible{opacity:1;translate:-50% 0}
    #freecell-live-preview .modal-shade{position:absolute;z-index:80;inset:0;display:none;place-items:center;padding:17px;background:rgba(2,15,25,.72)}
    #freecell-live-preview .modal-shade.open{display:grid}
    #freecell-live-preview .modal{position:relative;width:100%;max-width:330px;max-height:640px;box-sizing:border-box;padding:0 6px 7px;border:2px solid #e1ad45;border-radius:18px;background:linear-gradient(155deg,#1b6670 0%,#173e54 48%,#0b2133 100%);color:#fdf2d8;box-shadow:0 16px 34px rgba(0,12,24,.65),0 5px 0 #061725,inset 0 2px 0 rgba(218,255,251,.38),inset 0 -2px 0 rgba(1,12,24,.5);touch-action:auto;overflow:hidden;animation:modal-pop .16s ease-out}
    #freecell-live-preview .modal[data-kind="new-game"]{max-width:292px}
    #freecell-live-preview .modal[data-kind="themes"]{max-width:336px}
    #freecell-live-preview .modal-titlebar{position:relative;min-height:47px;display:grid;place-items:center;padding:0 45px;background:linear-gradient(110deg,rgba(41,176,175,.5),rgba(24,70,99,.28));border-bottom:1px solid rgba(225,173,69,.58);box-sizing:border-box}
    #freecell-live-preview .modal h2{margin:0;color:#fdf2d8;font-size:21px;font-weight:400;text-align:center;text-shadow:0 1px 2px rgba(0,20,31,.68)}
    #freecell-live-preview .modal-close{position:absolute;right:4px;top:7px;width:34px;height:34px;padding:0;border:2px solid #b87919;border-radius:50%;background:linear-gradient(#ffd267,#d99220);color:#173245;font:500 24px/28px Arial;box-shadow:inset 0 2px 1px rgba(255,255,255,.48),0 2px 0 #80530f;text-shadow:0 1px 0 rgba(255,255,255,.32);touch-action:manipulation}
    #freecell-live-preview #fc-modal-content{max-height:566px;overflow:auto;box-sizing:border-box;padding:10px;border:2px solid #247d82;border-radius:12px;background:radial-gradient(circle at 82% 0,rgba(28,151,154,.2),transparent 42%),linear-gradient(155deg,#0b3a45,#071e2d 76%);box-shadow:inset 0 2px 12px rgba(0,10,22,.62),inset 0 0 0 1px rgba(112,229,219,.14)}
    #freecell-live-preview .modal[data-kind="new-game"] #fc-modal-content{padding:12px;max-height:none}
    #freecell-live-preview .modal p{margin:0 0 12px;color:#fdf2d8;font-size:13px;line-height:1.45}
    #freecell-live-preview .modal-list{display:grid;gap:8px}
    #freecell-live-preview .modal-list button{appearance:none;border:1px solid #16888c;border-radius:8px;padding:11px 12px;background:linear-gradient(#36cfc4,#189aa0 72%,#117782);color:#fdf2d8;font:500 14px Roboto,Arial,sans-serif;text-align:center;text-shadow:0 1px 1px rgba(0,43,55,.75);box-shadow:0 4px 0 #0a5464,0 6px 9px rgba(0,8,24,.4),inset 0 2px 1px rgba(225,255,252,.36);touch-action:manipulation}
    #freecell-live-preview .modal-list button:active{translate:0 3px;box-shadow:0 1px 0 #0a5464,inset 0 1px 2px rgba(0,0,0,.2)}
    #freecell-live-preview .modal-section{margin:13px 0 7px;color:#e7ba5b;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    #freecell-live-preview .number-field{display:flex;gap:7px;margin-top:11px}
    #freecell-live-preview .number-field input{min-width:0;flex:1;border:1px solid #b8c6bc;border-radius:9px;padding:10px;background:#fff;color:#202421;font:400 16px Roboto,Arial,sans-serif}
    #freecell-live-preview .number-field button{appearance:none;border:0;border-radius:9px;padding:10px 13px;background:linear-gradient(#ffd369,#d99422);color:#173245;font:500 14px Roboto,Arial,sans-serif;box-shadow:0 3px 0 #805313}
    #freecell-live-preview .history-row{display:grid;grid-template-columns:1fr auto;gap:4px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.19);font-size:13px}
    #freecell-live-preview .history-row small{grid-column:1/-1;color:#8fc5c8}
    #freecell-live-preview .settings-list{display:grid}
    #freecell-live-preview .setting{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:43px;padding:0 3px;border-bottom:1px solid rgba(255,255,255,.13);color:#fdf2d8;font-size:13px}
    #freecell-live-preview .setting-label{line-height:1.18}
    #freecell-live-preview .toggle{position:relative;flex:0 0 66px;height:30px}
    #freecell-live-preview .toggle input{position:absolute;opacity:0;width:1px;height:1px}
    #freecell-live-preview .toggle-track{position:absolute;inset:0;border:2px solid #14552c;border-radius:17px;background:linear-gradient(#174f30,#286a3d);box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.15)}
    #freecell-live-preview .toggle-track::before{content:"OFF";position:absolute;right:8px;top:6px;color:#adc7b5;font-size:10px;line-height:14px}
    #freecell-live-preview .toggle-knob{position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8ff39,#88c915 65%,#5c9907);box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.58);transition:left .15s ease}
    #freecell-live-preview .toggle input:checked+.toggle-track{background:linear-gradient(#47d928,#15970f)}
    #freecell-live-preview .toggle input:checked+.toggle-track::before{content:"ON";left:8px;right:auto;color:#fdf2d8}
    #freecell-live-preview .toggle input:checked+.toggle-track .toggle-knob{left:38px}
    #freecell-live-preview .setting-action{appearance:none;width:100%;display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:0 3px;border:0;border-bottom:1px solid rgba(255,255,255,.13);background:transparent;color:#fdf2d8;font:400 13px Roboto,Arial,sans-serif;text-align:left}
    #freecell-live-preview .setting-action::after{content:"›";font-size:28px;line-height:1;color:#d8f8e4}
    #freecell-live-preview .setting-action .setting-value{margin-left:auto;color:#d0f1dc}
    #freecell-live-preview .game-menu button{min-height:50px;display:grid;grid-template-columns:37px 1fr 37px;align-items:center;padding:7px 9px;font-size:17px}
    #freecell-live-preview .game-menu button svg{width:24px;height:24px;stroke:#14721d;stroke-width:2.5;filter:drop-shadow(0 1px 0 rgba(255,255,255,.4))}
    #freecell-live-preview .game-menu button span{grid-column:2}
    #freecell-live-preview .theme-tabs{display:grid;grid-template-columns:1fr 1fr;margin:-10px -10px 12px;background:#0e5964}
    #freecell-live-preview .theme-tabs button{appearance:none;border:0;border-bottom:3px solid transparent;padding:9px 4px;background:rgba(0,0,0,.12);color:#b9e3e2;font:500 13px Roboto,Arial,sans-serif}
    #freecell-live-preview .theme-tabs button.active{border-bottom-color:#e9b94f;background:#197a81;color:#fdf2d8}
    #freecell-live-preview .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;padding:10px 5px 18px}
    #freecell-live-preview .theme-choice{appearance:none;position:relative;min-height:102px;padding:7px;border:0;border-radius:8px;background:rgba(0,0,0,.08);color:#fdf2d8}
    #freecell-live-preview .theme-choice.selected{box-shadow:0 0 0 3px #e9b94f,0 0 14px rgba(233,185,79,.62)}
    #freecell-live-preview .theme-card-preview{position:relative;display:block;width:58px;height:82px;margin:auto;border:1px solid #d4d4d4;border-radius:4px;background:#fff;color:#050505;box-shadow:0 3px 6px rgba(0,0,0,.35);font:500 24px/26px Georgia;text-align:left;padding:3px;box-sizing:border-box}
    #freecell-live-preview .theme-card-preview::after{content:"♚";position:absolute;left:50%;top:51%;translate:-50% -50%;font-size:34px;color:#c43625}
    #freecell-live-preview .theme-card-preview.modern{border-radius:9px;background:linear-gradient(145deg,#fff,#e7f0ea)}
    #freecell-live-preview .theme-card-preview.minimal::after{content:"♠";color:#111}
    #freecell-live-preview .theme-table-preview{display:block;width:64px;height:92px;margin:auto;border:2px solid rgba(255,255,255,.45);border-radius:4px;box-shadow:0 3px 7px rgba(0,0,0,.4),inset 0 0 18px rgba(0,0,0,.22)}
    #freecell-live-preview .table-classic{background:linear-gradient(145deg,#0c7c3d,#075b2c)}
    #freecell-live-preview .table-bright{background:linear-gradient(145deg,#15954a,#075b2c)}
    #freecell-live-preview .table-deep{background:linear-gradient(145deg,#087060,#06463d)}

      // The solver runner (v1.4 Part 1). A Web Worker built from the core block's own source runs

      // an older one resolves with null. Test builds log every run (solverTimings, DEV panel).
      const solverTimings=[];
      function recordSolverTiming(kind,result,ms,mode){
        if(!developerToolsEnabled)return;

        solverTimings.push(entry);if(solverTimings.length>60)solverTimings.shift();

      const solver=(()=>{
        const startMark=['/* freecell-','core:start'].join(''),endMark=['/* freecell-','core:end */'].join('');
        let worker=null,workerFailed=false,running=null,waiting=null,nextId=1,sliceTimer=0;
        const coreSource=()=>{for(const script of document.scripts){const text=script.textContent,start=text.indexOf(startMark),end=text.indexOf(endMark);if(start>=0&&end>start)return text.slice(start,end)}return ''};

        function ensureWorker(){
          if(worker||workerFailed)return worker;
          try{
            const code=coreSource();if(!code||typeof Worker!=='function'||typeof Blob!=='function')throw new Error('no worker');
            const url=URL.createObjectURL(new Blob([`${code}
self.onmessage=event=>{const {id,state,budget}=event.data,started=performance.now();let result;try{result=FreeCellCore.runToEnd(FreeCellCore.analyse(state,budget))}catch(error){result={status:'unknown',line:[],expanded:0}}self.postMessage({id,result,ms:performance.now()-started})};`],{type:'text/javascript'}));
            worker=new Worker(url);URL.revokeObjectURL(url);
            worker.onmessage=event=>finish(event.data.id,event.data.result,event.data.ms,'worker');
            worker.onerror=event=>{event.preventDefault?.();workerFailed=true;worker?.terminate();worker=null;const job=running;running=null;if(job)start(job)};
          }catch(error){workerFailed=true;worker=null}
          return worker;
        }
        function start(job){
          running=job;job.startedAt=performance.now();
          if(ensureWorker()){worker.postMessage({id:job.id,state:job.state,budget:job.budget});return}
          const iterator=FreeCellCore.analyse(job.state,{...job.budget,now:()=>performance.now()});
          const slice=()=>{if(running!==job)return;const step=iterator.next();if(step.done)finish(job.id,step.value,performance.now()-job.startedAt,'main');else sliceTimer=setTimeout(slice,0)};
          sliceTimer=setTimeout(slice,0);
        }
        function finish(id,result,ms,mode){
          const job=running;if(!job||job.id!==id)return;

          if(!job.cancelled)job.resolve(result);

          analyse(state,budget,kind){
            return new Promise(resolve=>{
              const job={id:nextId++,state:plain(state),budget,kind,resolve};

        }catch(error){}
      }
      function checkGoals({afterWin=false}={}){
        if(!goals||(afterWin&&(currentMode==='developer'||quickWinUsed)))return;
        const reached=FreeCellCore.goalsReached(goals,{introDone:introDone(),dailyWins:FreeCellCore.dailyWinCount(dailyHistory),wins:stats.wins,today:todayKey()});
        const names=afterWin?reached:reached.filter(name=>name==='day2_return');if(!names.length)return;
        goals=FreeCellCore.markGoals(goals,names);names.forEach(name=>track(name,{level:playerLevel}));
        syncUserProperties();remember();
      }
      function startInitialFlow(){
        if(startupFlowComplete)return;startupFlowComplete=true;
        loadGameConfig();
        goals=FreeCellCore.cleanGoals(savedState.goals,{existing:Number(savedState.stats?.started)>0,today:todayKey(),
          progress:{introDone:introDone(),dailyWins:FreeCellCore.dailyWinCount(dailyHistory),wins:Number(savedState.stats?.wins)||0}});if(!gameConfig.languages.enabled.includes(currentLanguage)){chooseLanguage();applyLanguage()}applySizes();applyEffects();applyThemeAccess();refreshForNewDay();readBillingState();recoverRewarded();syncReminders();
        // Achievements a save already deserves (older saves, or a new tier from Remote Config) unlock now.
        if(recordAchievements({}).length)remember();
        track('app_ready',{first_run:Boolean(firstRunTutorialRequired),load_ms:Math.round(performance.now()-appStartedAt)});
        syncUserProperties();checkGoals();remember();
        if(firstRunTutorialRequired){tutorialView(true);reportStartup();return}
        if(!restoreSavedGame())startDeal({mode:'random',label:t('randomGame')});else if(smartHints())scheduleAnalysis();
        reportStartup();
        setTimeout(()=>{if(!reminderOpened())maybeShowEventIntro()},900);
      }
      function runLoadingFlow(){
        const loading=find('#fc-loading');if(!loading){startInitialFlow();return}
        const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches||lowEffects;
        const suits=[...loading.querySelectorAll('.loading-suit')],fill=find('#fc-loading-fill');
        const stages=reduced?[{delay:60,value:76,count:3},{delay:120,value:100,count:4}]:[{delay:260,value:24,count:1},{delay:560,value:51,count:2},{delay:900,value:76,count:3},{delay:1240,value:100,count:4}];
        const showStage=stage=>{if(fill)fill.style.width=`${stage.value}%`;suits.forEach((suit,index)=>suit.classList.toggle('active',index<stage.count))};
        const finalStage=stages[stages.length-1];
        stages.slice(0,-1).forEach(stage=>setTimeout(()=>showStage(stage),stage.delay));
        const finishAt=reduced?420:1660;
        // The last step waits for the consent answer: the form always appears over this screen,
        // and nothing behind it (tutorial, game, ads) starts until the user has answered.
        setTimeout(()=>whenConsentResolved(()=>{
          showStage(finalStage);
          setTimeout(()=>{loading.classList.add('leaving');setTimeout(()=>{loading.remove();startInitialFlow()},reduced?80:350)},finishAt-finalStage.delay);
        }),finalStage.delay);
      }
      // Performance (2026-11-05): after a move the game is saved once the player pauses (600 ms), not after
      // every card: on an old phone, writing the whole saved state through the bridge on each card of an
      // automatic chain made it stutter. A win, the app going to the background (MainActivity.onPause
      // calls freecellSave) and every other change still save at once.
      let saveTimer=0;
      function rememberSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=0;remember()},600)}
      function remember(){
        clearTimeout(saveTimer);saveTimer=0;
        const persistent={version:2,currentLanguage,tableThemeName,cardThemeName,playerLevel,levelWins,currentLevelNumber,levelAwarded,options:{...options},stats:{...stats},gameLog:gameLog.slice(0,8),
          coins,owned,cardBackName,victoryEffectName,events:eventState,rewarded:rewardedState,reminders,starBest,achievements:achievementsState,paidKeys,dealCounter,dailyHistory,latestDate,debugDayOffset,dailyBonus,missions:missionsState,missionSets,latestTime,missionsCelebrationPending,introIndex,adaptLevel,tips:tipsState,promos,previewSessions,difficultyTier,tierHistory,rivals:rivalsResults,goals:goals||savedState.goals||null,
          game:{tableau:copyBoard(tableau),stock:copyStock(stock),foundations:[...foundations],done:[...done],suits:suitsMode,score,history:history.slice(-40),moves,seconds,currentSeed,currentMode,currentLabel,dealId,usedUndo:gameUsedUndo,undos:gameUndos,dailyDate:currentDailyDate,foundationPeak:gameFoundationPeak,usedHint:gameUsedHint,suitPeak:gameSuitPeak,emptiedColumns:gameEmptiedColumns,tier:currentTier,pool:currentPool,hints:gameHints}};
        updateMissionsButton();updateEventButton();saveCollection();
        try{if(window.AndroidBridge?.saveState)window.AndroidBridge.saveState(JSON.stringify(persistent));else localStorage.setItem('freecellState',JSON.stringify(persistent))}catch(error){}
        const api=window.openai?.setWidgetState;if(typeof api==='function')api({modelContent:{moves,score,mode:currentMode,language:currentLanguage,level:playerLevel,levelWins,winsNeeded:winsNeeded(playerLevel),settings:{tap:options.tap,autoHint:options.autoHint,autoComplete:options.autoComplete,showCounters:options.showCounters,highlight:options.highlight},theme:{table:tableThemeName,cards:cardThemeName}},privateContent:null}).catch(()=>{});
      }
      window.freecellSave=remember;
      window.freecellBack=()=>{if(find('#fc-loading'))return true;const tutorial=find('.tutorial-layer');if(tutorial){if(!onboardingTutorial)closeTutorial();return true}const shade=find('#fc-modal-shade');if(shade.classList.contains('open')){if(find('.modal')?.dataset.kind==='language')leaveLanguageView();else if(!onboardingTutorial)closeModal();return true}return false};
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(isDealing)dealUnseen=true;remember();clearTimeout(analysisTimer);solver.cancel();if(audioContext?.state==='running')audioContext.suspend().catch(()=>{})}else{setTimeout(replayUnseenDeal,150);checkGoals();if(smartHints())scheduleAnalysis();refreshForNewDay();if(startupFlowComplete)maybeShowEventIntro()}});
      setInterval(()=>{if(document.visibilityState!=='hidden')refreshForNewDay()},60000);window.addEventListener('pagehide',remember);
      // The clock stops when the game is won (2026-11-05: it kept counting behind the victory panel, so a
      // shared result could show a longer time than the panel).
      setInterval(()=>{if(gameplayActive&&document.visibilityState!=='hidden'&&!foundations.every(value=>value===13)){seconds++;find('#fc-time').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;if(seconds%15===0)remember()}},1000);
      applySavedAppearance();applyLanguage();const initDoneAt=performance.now();runLoadingFlow();setTimeout(scheduleAudioWarmUp,1200);
    })();
  </script>
</div>
